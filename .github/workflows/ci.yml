name: CI

on:
  push:
    branches: [master, main, ci-test-debug, minimal-ci-test]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: self-hosted

    permissions:
      contents: write
      pull-requests: write
      checks: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run fast single test (Chromium headless_shell)
        run: |
          nix run .#test-one

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Temporary guard: fail after tests to prevent merge
        if: success() && github.event_name == 'pull_request'
        run: |
          echo "Intentionally failing to prevent auto-merge while stabilizing CI."
          exit 1

      - name: Deploy to production
        if: github.ref == 'refs/heads/main' && success()
        run: |
          echo "Deploying locally on Hetzner server..."
          
          # Build client assets first
          nix develop --command bun run build:client
          
          # Since we're running on the same server, just copy files directly
          sudo systemctl stop slipbox
          
          # Copy source files (we're already in the repo)
          sudo rsync -av --delete \
            --exclude node_modules \
            --exclude .git \
            --exclude "*.db" \
            --exclude "*.db-*" \
            --exclude playwright-report \
            --exclude test-results \
            --exclude .claude \
            --exclude "dist/*.js" \
            --exclude "dist/*.gz" \
            --exclude "dist/slipbox-*" \
            ./ /opt/slipbox/
          
          # Install dependencies
          cd /opt/slipbox
          sudo -u justin bun install
          
          # Restart service
          sudo systemctl start slipbox
          
          # Verify deployment
          sleep 3
          if systemctl is-active --quiet slipbox; then
            echo "✅ Deployment successful!"
          else
            echo "❌ Deployment failed!"
            sudo journalctl -u slipbox -n 20 --no-pager
            exit 1
          fi
