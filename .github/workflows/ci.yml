name: CI
on:
  pull_request:
    branches: [ master ]

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: [self-hosted, nixos, hetzner]
    steps:
      - uses: actions/checkout@v4

      - name: Build with Nix (impure)
        run: |
          nix build .#server --impure --option sandbox false

      - name: Run CI tests with Nix
        run: |
          nix run .#ci --impure --option sandbox false

      - name: Smoke test server starts
        run: |
          rm -rf /tmp/slipbox-test-$$
          SLIPBOX_DATA_DIR=/tmp/slipbox-test-$$ PORT=3001 timeout 10 ./result/bin/slipbox || true
          rm -rf /tmp/slipbox-test-$$
          echo "Server starts successfully"

      - name: Auto-merge PR
        run: |
          # Load PAT from local file on runner (fallback to secret if present)
          if [ -z "${GH_TOKEN:-}" ]; then
            export GH_TOKEN="$(grep -E '^(gh(p|s|u)p?_?|github_pat_)' ~/configs/secrets/github-pat.txt | head -n1 | tr -d '\r\n')"
          fi
          echo "Auto-merging PR #${{ github.event.pull_request.number }}"
          gh pr merge ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --squash \
            --delete-branch
