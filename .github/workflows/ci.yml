name: CI

on:
  workflow_dispatch:
  push:
    branches: [master, main, ci-fix-attempt-2]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: self-hosted

    permissions:
      contents: write
      pull-requests: write
      checks: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Debug Environment
        run: |
          echo "=== Environment Variables ==="
          env | sort | head -20
          echo "=== Process Limits ==="
          ulimit -a
          echo "=== User Info ==="
          id
          whoami
          groups
          echo "=== XDG Runtime ==="
          echo "XDG_RUNTIME_DIR=${XDG_RUNTIME_DIR:-not set}"
          ls -la "${XDG_RUNTIME_DIR:-/run/user/$(id -u)}" 2>/dev/null || echo "Runtime dir does not exist"
          echo "=== Systemd Service Info ==="
          systemctl show github-runner-hetzner-runner.service | grep -E "NoNewPrivileges|RestrictNamespaces|PrivateUsers|PrivateTmp|TasksMax|LimitNOFILE" || true

      - name: Setup Browser Environment
        run: |
          # Create XDG runtime directory
          export XDG_RUNTIME_DIR="${RUNNER_TEMP:-/tmp}/xdg-runtime-$$"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> $GITHUB_ENV
          
          # Raise resource limits
          ulimit -n 1048576 || ulimit -n 65536 || true
          ulimit -u 8192 || true
          
          # Clear problematic env vars
          unset DBUS_SESSION_BUS_ADDRESS || true
          
          echo "Browser runtime directory created at: $XDG_RUNTIME_DIR"

      - name: Run fast single test
        env:
          XDG_RUNTIME_DIR: ${{ env.XDG_RUNTIME_DIR }}
          PLAYWRIGHT_SKIP_VALIDATE_HOST_REQUIREMENTS: "1"
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
          DEBUG: "pw:browser*"
        run: |
          # Ensure XDG_RUNTIME_DIR is set
          echo "Using XDG_RUNTIME_DIR: ${XDG_RUNTIME_DIR}"
          
          # Run tests directly without nix sandbox to avoid browser issues
          nix develop --command bash -c "bun install && bun run build:client && bun run test:ci"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Deploy to production
        if: github.ref == 'refs/heads/main' && success()
        run: |
          echo "Deploying locally on Hetzner server..."
          
          # Build client assets first
          nix develop --command bun run build:client
          
          # Since we're running on the same server, just copy files directly
          sudo systemctl stop slipbox
          
          # Copy source files (we're already in the repo)
          sudo rsync -av --delete \
            --exclude node_modules \
            --exclude .git \
            --exclude "*.db" \
            --exclude "*.db-*" \
            --exclude playwright-report \
            --exclude test-results \
            --exclude .claude \
            --exclude "dist/*.js" \
            --exclude "dist/*.gz" \
            --exclude "dist/slipbox-*" \
            ./ /opt/slipbox/
          
          # Install dependencies
          cd /opt/slipbox
          sudo -u justin bun install
          
          # Restart service
          sudo systemctl start slipbox
          
          # Verify deployment
          sleep 3
          if systemctl is-active --quiet slipbox; then
            echo "✅ Deployment successful!"
          else
            echo "❌ Deployment failed!"
            sudo journalctl -u slipbox -n 20 --no-pager
            exit 1
          fi