name: CI
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: [self-hosted, nixos, hetzner]
    steps:
      - uses: actions/checkout@v4

      - name: Build with Nix (impure)
        run: |
          nix build .#server --impure --option sandbox false

      - name: Smoke test server starts
        run: |
          rm -rf /tmp/slipbox-test-$$
          SLIPBOX_DATA_DIR=/tmp/slipbox-test-$$ PORT=3001 timeout 10 ./result/bin/slipbox || true
          rm -rf /tmp/slipbox-test-$$
          echo "Server starts successfully"

      - name: Dispatch bump-configs (PR pre-merge)
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          # Resolve PAT
          if [ -z "${GH_TOKEN:-}" ]; then
            for p in /home/justin/configs/secrets/github-pat.txt ~justin/configs/secrets/github-pat.txt ~/configs/secrets/github-pat.txt; do
              if [ -f "$p" ]; then
                export GH_TOKEN="$(cat "$p" | tr -d '\r\n')"; break;
              fi
            done
          fi
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "Missing GH_TOKEN (and no PAT file found); skipping bump." >&2
            exit 0
          fi
          sha="${{ github.event.pull_request.head.sha }}"
          echo "Dispatching repository_dispatch bump-configs with sha=$sha"
          GH_HEADER="Authorization: token $GH_TOKEN"
          curl -sSf -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "$GH_HEADER" \
            https://api.github.com/repos/${GITHUB_REPOSITORY}/dispatches \
            -d "$(jq -n --arg sha "$sha" '{event_type:"bump-configs", client_payload:{sha:$sha}}')"

      - name: Auto-merge PR
        if: github.event_name == 'pull_request'
        env:
          FALLBACK_GITHUB_TOKEN: ${{ github.token }}
        run: |
          # Resolve token robustly: prefer GH_TOKEN, else read from absolute path
          if [ -z "${GH_TOKEN:-}" ]; then
            for p in /home/justin/configs/secrets/github-pat.txt ~justin/configs/secrets/github-pat.txt ~/configs/secrets/github-pat.txt; do
              if [ -f "$p" ]; then
                export GH_TOKEN="$(cat "$p" | tr -d '\r\n')"; break;
              fi
            done
          fi
          # Fallback to GitHub-provided token (sufficient for merging PRs in this repo)
          if [ -z "${GH_TOKEN:-}" ] && [ -n "${FALLBACK_GITHUB_TOKEN:-}" ]; then
            export GH_TOKEN="$FALLBACK_GITHUB_TOKEN"
          fi
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "Missing GH_TOKEN (and no PAT file found)" >&2
            exit 1
          fi
          echo "Auto-merging PR #${{ github.event.pull_request.number }}"
          gh pr merge ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --squash \
            --delete-branch

      - name: Create PR in configs repo
        if: github.event_name == 'push'
        env:
          FALLBACK_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Resolve token robustly: prefer GH_TOKEN, else read from absolute path
          if [ -z "${GH_TOKEN:-}" ]; then
            for p in /home/justin/configs/secrets/github-pat.txt ~justin/configs/secrets/github-pat.txt ~/configs/secrets/github-pat.txt; do
              if [ -f "$p" ]; then
                export GH_TOKEN="$(cat "$p" | tr -d '\r\n')"; break;
              fi
            done
          fi
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "Missing GH_TOKEN (and no PAT file found)" >&2
            exit 1
          fi
          sha="${GITHUB_SHA}"
          echo "Creating PR in configs to bump slipbox to $sha"

          tmpdir="/tmp/configs-$$-${RANDOM}"
          git clone "https://x-access-token:${GH_TOKEN}@github.com/justinmoon/configs.git" "$tmpdir"
          cd "$tmpdir"

          git config user.name 'slipbox-bot'
          git config user.email 'bot@users.noreply.github.com'

          branch="bump-slipbox-${sha:0:7}"
          git checkout -b "$branch"

          # Update flake.lock to point slipbox input to this commit
          nix flake lock \
            --override-input slipbox "github:justinmoon/slipbox/${sha}" \
            --update-input slipbox

          git add flake.lock
          git commit -m "bump: slipbox to ${sha:0:7}" || echo "No changes to commit"

          # Only push and open PR if there are changes
          if git diff --quiet origin/master..HEAD; then
            echo "No lockfile changes; skipping PR."
            exit 0
          fi

          git push -u origin "$branch"

          cat > /tmp/pr-body-$$.md << 'EOF'
          Automated PR to update slipbox to the latest commit.

          This PR was created by slipbox CI. After merge, the GitOps pipeline
          on Hetzner will rebuild and deploy via nixos-rebuild.
          
          Note: Ensure configs/flake.nix declares a `slipbox` input and the
          slipbox service uses the flake package rather than an imperative path.
          EOF

          gh pr create \
            --repo justinmoon/configs \
            --base master \
            --head "$branch" \
            --title "Bump slipbox to ${sha:0:7}" \
            --body-file /tmp/pr-body-$$.md
