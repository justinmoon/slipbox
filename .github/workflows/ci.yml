name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: [self-hosted, linux, nixos, hetzner]

    permissions:
      contents: write
      pull-requests: write
      checks: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run checks and tests in Nix environment
        run: |
          # Use xvfb-run to provide a virtual display
          xvfb-run -a nix run .#ci
        env:
          # Ensure we have a display for Chrome
          DISPLAY: ":99"
          # Enable Playwright debugging
          DEBUG: "pw:browser*"
          PLAYWRIGHT_DEBUG: "1"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Auto-merge PR
        if: |
          success() && 
          github.event_name == 'pull_request' && 
          github.event.pull_request.user.login == github.repository_owner
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "All tests passed! Merging PR #${{ github.event.pull_request.number }}"
          gh pr merge ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --squash \
            --delete-branch

      - name: Deploy to production
        if: github.ref == 'refs/heads/main' && success()
        run: |
          echo "Deploying locally on Hetzner server..."
          
          # Build client assets first
          nix develop --command bun run build:client
          
          # Since we're running on the same server, just copy files directly
          sudo systemctl stop slipbox
          
          # Copy source files (we're already in the repo)
          sudo rsync -av --delete \
            --exclude node_modules \
            --exclude .git \
            --exclude "*.db" \
            --exclude "*.db-*" \
            --exclude playwright-report \
            --exclude test-results \
            --exclude .claude \
            --exclude "dist/*.js" \
            --exclude "dist/*.gz" \
            --exclude "dist/slipbox-*" \
            ./ /opt/slipbox/
          
          # Install dependencies
          cd /opt/slipbox
          sudo -u justin bun install
          
          # Restart service
          sudo systemctl start slipbox
          
          # Verify deployment
          sleep 3
          if systemctl is-active --quiet slipbox; then
            echo "✅ Deployment successful!"
          else
            echo "❌ Deployment failed!"
            sudo journalctl -u slipbox -n 20 --no-pager
            exit 1
          fi