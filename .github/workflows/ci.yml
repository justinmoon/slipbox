name: CI

on:
  push:
    branches: [master, main, fresh-ci-test]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: self-hosted

    permissions:
      contents: write
      pull-requests: write
      checks: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: DEBUG - Test nix run .#test-one in CI environment
        run: |
          echo "Testing if nix run .#test-one works in GitHub Actions..."
          nix run .#test-one

      - name: DEBUG - Intentional failure to prevent merge
        run: |
          echo "This is an intentional failure for debugging purposes."
          echo "We want to see if the nix test above passes before failing."
          exit 1

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

