name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: self-hosted

    permissions:
      contents: write
      pull-requests: write
      checks: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run CI
        run: |
          nix run .#ci

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Deploy to production
        if: success()
        run: |
          set -euo pipefail
          echo "Building production binary with script..."
          bash scripts/build-binary.sh
          
          echo "Adding binary to Nix store..."
          # Add the binary directly to the store
          STORE_PATH=$(nix store add-file dist/slipbox-linux --name slipbox)
          echo "Binary added to store: $STORE_PATH"
          
          # Create a simple derivation that references the binary
          cat > default.nix <<'NIXEOF'
          { pkgs ? import <nixpkgs> {} }:
          pkgs.runCommand "slipbox-binary" {} ''
            mkdir -p $out/bin
            ln -s STORE_PATH_PLACEHOLDER $out/bin/slipbox
          ''
          NIXEOF
          
          # Replace placeholder with actual store path
          sed -i "s|STORE_PATH_PLACEHOLDER|$STORE_PATH|" default.nix
          
          echo "Building wrapper package..."
          out=$(nix-build default.nix --no-out-link)
          echo "Built package: $out"
          
          echo "Installing to system profile..."
          sudo /run/current-system/sw/bin/nix profile install --profile /nix/var/nix/profiles/slipbox "$out"
          
          echo "Restarting service..."
          sudo systemctl restart slipbox
          
          echo "Verifying service health..."
          sleep 2
          sudo systemctl is-active slipbox
          curl -fsS http://localhost:3000/ >/dev/null || (sudo journalctl -u slipbox -n 50 --no-pager; exit 1)

      - name: Auto-merge PR
        if: |
          success() && 
          github.event_name == 'pull_request' && 
          github.event.pull_request.user.login == github.repository_owner
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "All tests and deployment passed! Merging PR #${{ github.event.pull_request.number }}"
          gh pr merge ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --squash \
            --delete-branch
