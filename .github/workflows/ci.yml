name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: self-hosted

    permissions:
      contents: write
      pull-requests: write
      checks: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run CI
        run: |
          nix run .#ci

      - name: Build production package
        if: success()
        run: |
          nix build .#slipbox
          echo "Store path: $(readlink result)"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Deploy to production
        if: success()
        run: |
          # Clean and sync to consistent build directory for nix profile tracking
          rm -rf /build/slipbox
          mkdir -p /build/slipbox
          cp -r . /build/slipbox/
          cd /build/slipbox
          ci-deploy slipbox .#slipbox

      - name: Auto-merge PR
        if: |
          success() && 
          github.event_name == 'pull_request' && 
          github.event.pull_request.user.login == github.repository_owner
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "All tests and deployment passed! Merging PR #${{ github.event.pull_request.number }}"
          /run/current-system/sw/bin/gh pr merge ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --squash \
            --delete-branch
