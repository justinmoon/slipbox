name: PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  tests:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      
      - name: Install dependencies
        run: bun install
      
      - name: Setup test data directories
        run: |
          mkdir -p ~/.slipbox-dev/files
          echo "Test data directories created"
      
      - name: Build CSS
        run: bun run build:css
      
      - name: Build static TypeScript files
        run: bun run build:static
      
      - name: Install Playwright browsers
        run: bunx playwright install chromium
      
      - name: Run tests
        run: bun run test:ci
        env:
          CI: true
      
      - name: Comment test results on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { execSync } = require('child_process');
            
            let status = '✅ All tests passed!';
            let details = '';
            
            try {
              // Check if tests failed
              if (process.env.TEST_FAILED === 'true') {
                status = '❌ Some tests failed';
              }
            } catch (e) {
              console.log('Could not determine test status');
            }
            
            const comment = `## Test Results
            
            ${status}
            
            Tests have been run with \`bun run test:ci\`
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });