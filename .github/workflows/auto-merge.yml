name: Auto-merge

on:
  workflow_run:
    workflows: ["CI", "PR Checks"]
    types:
      - completed

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
    
    permissions:
      contents: write
      pull-requests: write
      
    steps:
      - name: Get PR number
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            // Find the PR associated with this workflow run
            const { data: pulls } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${context.repo.owner}:${context.payload.workflow_run.head_branch}`
            });
            
            if (pulls.length === 0) {
              console.log('No open PR found for branch:', context.payload.workflow_run.head_branch);
              return;
            }
            
            const pr = pulls[0];
            console.log(`Found PR #${pr.number} for branch ${context.payload.workflow_run.head_branch}`);
            
            // Check if PR author is the repository owner
            if (pr.user.login !== context.repo.owner) {
              console.log(`PR author ${pr.user.login} is not the repository owner, skipping auto-merge`);
              return;
            }
            
            return pr.number;
      
      - name: Wait for all checks to complete
        if: steps.pr.outputs.result
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = ${{ steps.pr.outputs.result }};
            if (!prNumber) return;
            
            // Wait up to 5 minutes for all checks to complete
            const maxAttempts = 30;
            const delay = 10000; // 10 seconds
            
            for (let attempt = 0; attempt < maxAttempts; attempt++) {
              const { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber
              });
              
              // Get all check runs for this commit
              const { data: checkRuns } = await github.rest.checks.listForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: pr.head.sha
              });
              
              const checks = checkRuns.check_runs;
              const pending = checks.filter(c => c.status !== 'completed');
              const failed = checks.filter(c => c.conclusion === 'failure' || c.conclusion === 'cancelled');
              
              console.log(`Attempt ${attempt + 1}: ${pending.length} checks pending, ${failed.length} failed`);
              
              if (failed.length > 0) {
                console.log('Some checks failed, cannot auto-merge');
                core.setFailed('CI checks failed');
                return;
              }
              
              if (pending.length === 0 && checks.length > 0) {
                console.log('All checks completed successfully!');
                break;
              }
              
              if (attempt < maxAttempts - 1) {
                await new Promise(resolve => setTimeout(resolve, delay));
              } else {
                console.log('Timeout waiting for checks to complete');
                return;
              }
            }
      
      - name: Merge PR
        if: steps.pr.outputs.result
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER="${{ steps.pr.outputs.result }}"
          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = "undefined" ]; then
            echo "No PR number found, skipping merge"
            exit 0
          fi
          
          echo "Merging PR #$PR_NUMBER"
          gh pr merge "$PR_NUMBER" \
            --repo ${{ github.repository }} \
            --squash \
            --delete-branch || echo "Could not merge PR #$PR_NUMBER"