name: Auto-merge on CI success

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  check_suite:
    types: [completed]
  workflow_run:
    workflows: ["CI"]  # Replace with your actual CI workflow name
    types: [completed]

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: |
      github.event.pull_request.draft == false &&
      (github.event.workflow_run.conclusion == 'success' ||
      github.event.check_suite.conclusion == 'success')
    steps:
      - name: Check if PR is ready
        id: pr-check
        uses: actions/github-script@v7
        with:
          script: |
            if (context.payload.pull_request) {
              // Direct PR event
              const isDraft = context.payload.pull_request.draft;
              if (isDraft) {
                console.log('PR is a draft, skipping auto-merge');
                return { shouldMerge: false };
              }
            } else {
              // Workflow run or check suite event - need to find associated PRs
              const { data: pulls } = await github.rest.pulls.list({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open'
              });
              
              // Find PRs associated with this workflow run
              for (const pr of pulls) {
                if (pr.draft) {
                  console.log(`PR #${pr.number} is a draft, skipping`);
                  continue;
                }
                // Check if this PR's head SHA matches the workflow run
                if (context.payload.workflow_run && 
                    pr.head.sha === context.payload.workflow_run.head_sha) {
                  return { shouldMerge: true, prNumber: pr.number };
                }
              }
            }
            return { shouldMerge: true };

      - name: Auto-merge PR
        if: steps.pr-check.outputs.shouldMerge != 'false'
        uses: pascalgn/merge-action@v0.15.6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Only merge if all checks pass
          merge_method: "squash"  # or "merge" or "rebase"
          # Optional: add a label like "ready-to-merge" to control which PRs auto-merge
          # labels: "ready-to-merge"