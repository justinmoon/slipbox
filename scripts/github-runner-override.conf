# Systemd override for GitHub Actions runner to allow browser launching
# Place this file at: /etc/systemd/system/github-runner-hetzner-runner.service.d/override.conf
# Then run: sudo systemctl daemon-reload && sudo systemctl restart github-runner-hetzner-runner

[Service]
# Remove sandbox restrictions that prevent browser launching
NoNewPrivileges=no
RestrictNamespaces=no
PrivateUsers=no
PrivateTmp=no
PrivateDevices=no
ProtectHome=no
ProtectSystem=no
SystemCallFilter=
CapabilityBoundingSet=

# Enable PAM session for proper runtime directory
PAMName=login

# Set environment variables
Environment="XDG_RUNTIME_DIR=/run/user/%U"
Environment="PLAYWRIGHT_SKIP_VALIDATE_HOST_REQUIREMENTS=1"
Environment="PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1"

# Increase resource limits for browser processes
TasksMax=infinity
LimitNOFILE=1048576
LimitNPROC=16384
OOMPolicy=continue

# Ensure we wait for systemd-logind
Wants=systemd-logind.service
After=systemd-logind.service